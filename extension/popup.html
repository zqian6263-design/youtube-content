<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body { width: 320px; font-family: -apple-system, "Microsoft YaHei", sans-serif;
         font-size: 13px; padding: 12px; color: #24292f; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d0d7de;
          border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
  button { width: 100%; padding: 9px; background: #1f6feb; color: #fff; border: none;
           border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1857c1; }
  #status { margin-top: 10px; white-space: pre-wrap; word-break: break-word;
            max-height: 280px; overflow-y: auto; font-size: 12px; }
  .err { color: #cf222e; }
  .hint { color: #57606a; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
  <h3>🎬 YouTube 内容总结</h3>
  <input id="url" placeholder="粘贴视频链接或 ID（留空 = 当前标签页）">
  <button id="run">🚀 提取内容</button>
  <div id="status"></div>
  <div class="hint">需要本地运行: <code>python scripts/webui.py</code>（8080 端口）</div>

<script src="popup.js"></script>
</body>
</html>
