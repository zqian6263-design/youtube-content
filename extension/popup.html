<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body { width: 320px; font-family: -apple-system, "Microsoft YaHei", sans-serif;
         font-size: 13px; padding: 12px; color: #24292f; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d0d7de;
          border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
  button { width: 100%; padding: 9px; background: #1f6feb; color: #fff; border: none;
           border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1857c1; }
  #status { margin-top: 10px; white-space: pre-wrap; word-break: break-word;
            max-height: 280px; overflow-y: auto; font-size: 12px; }
  .err { color: #cf222e; }
  .hint { color: #57606a; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
  <h3>🎬 YouTube 内容总结</h3>
  <input id="url" placeholder="粘贴视频链接或 ID（留空 = 当前标签页）">
  <button id="run">🚀 提取内容</button>
  <div id="status"></div>
  <div class="hint">需要本地运行: <code>python scripts/webui.py</code>（8080 端口）</div>

<script>
const API = 'http://127.0.0.1:8080/api/quick';
const statusEl = document.getElementById('status');

document.getElementById('run').addEventListener('click', async () => {
  let url = document.getElementById('url').value.trim();
  if (!url) {
    // Try current tab (YouTube or Bilibili)
    const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
    let m = tab.url.match(/[?&]v=([\w-]{11})/);
    if (m) url = m[1];
    else {
      m = tab.url.match(/BV[a-zA-Z0-9]+/);
      if (m) url = m[0];
      else { statusEl.textContent = '⚠ 当前页面不是 YouTube/B站 视频页'; statusEl.className = 'err'; return; }
    }
  }
  statusEl.textContent = '⏳ 处理中...';
  statusEl.className = '';
  try {
    const resp = await fetch(`${API}?url=${encodeURIComponent(url)}&max=2500`,
      { signal: AbortSignal.timeout(60000) });
    const data = await resp.json();
    if (data.status === 'success') {
      let out = `🎬 ${data.title || ''}\n\n`;
      if (data.chapters && data.chapters.length) {
        out += '📑 章节:\n' + data.chapters.slice(0, 10).map(c =>
          `  ${c.start_ts} — ${c.title}`).join('\n') + '\n\n';
      }
      if (data.summary) {
        out += '📝 总结:\n' + data.summary + '\n\n📄 原文（展开）:\n';
      }
      out += data.text || '';
      statusEl.textContent = out;
    } else {
      statusEl.textContent = '❌ ' + (data.message || '处理失败');
      statusEl.className = 'err';
    }
  } catch (e) {
    statusEl.textContent = '❌ 无法连接本地服务。\n请先运行 python scripts/webui.py';
    statusEl.className = 'err';
  }
});
</script>
</body>
</html>
